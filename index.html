<style>

.task{display:flex;gap:12px;align-items:center}.task .tx{flex:1;min-width:0}.rw{color:var(--au);font:600 13px Sora}
.inp{width:100%;background:#0a1324;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:500 15px Sora}.inp:focus{outline:2px solid var(--g2);border-color:transparent}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.chips button{padding:8px 0;border-radius:11px;background:var(--card);border:1px solid var(--line);font:600 13px Sora}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pm button{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left}.pm button.on{border-color:var(--g1);background:#0e2a26}

.qa,.card,.pill,.tabs button,.pm button{transition:transform .15s,border-color .2s,background .2s}

#modal.on{animation:mfade .2s both}#modal.on .card{animation:mpop .3s cubic-bezier(.2,1.2,.4,1) both}@keyframes mfade{from{opacity:0}}@keyframes mpop{from{opacity:0;transform:translateY(20px) scale(.95)}}

.card.row:active,.task:active{transform:scale(.99)}
@media(prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .pg i{width:100%}}

nav{background:linear-gradient(180deg,#0d1830,#070e1c);border-top:1px solid #1d3a5c;box-shadow:0 -10px 24px #0008}
