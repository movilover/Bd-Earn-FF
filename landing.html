<style>

.w{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.hero h2{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:15px;z-index:3;text-shadow:0 2px 6px #000a}.hero h2 span{color:var(--au);font:700 22px Sora;display:block;animation:pulse 2s ease-in-out infinite}

.st{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#122e23;white-space:nowrap}.ok .st{color:var(--g1);background:#143a2c;border-color:#1e5240}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;font-weight:700;color:#051c13;background:linear-gradient(180deg,#49e7ae,#3ddaa1);box-shadow:0 3px 0 #127250,0 6px 12px #0004}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #127250}
.btn.au{background:linear-gradient(180deg,#ffdc82,#e8a727);color:#2b1a00;box-shadow:0 3px 0 #a8730b,0 6px 12px #0004}
.code{display:flex;gap:8px;justify-content:center;margin:14px 0}.code i{width:44px;height:56px;border-radius:12px;background:#091812;border:1px solid #2b7a5e;display:grid;place-items:center;font:700 28px Sora;font-style:normal;color:var(--au);animation:flip .6s both}

.hide{display:none!important}.c{text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bn,.pop{opacity:.8}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cf2b9"/><stop offset="1" stop-color="#F5C451"/></linearGradient>

<div class="w">
<div class="top"><div class="logo" id="lg">B</div><b id="sn">BD Earn FF</b><span class="tag">🎯 Ad Job</span></div>
<div class="hero" id="scene"><h2><em id="ht" style="font-style:normal">বিজ্ঞাপন দেখুন, কোড নিন, আয় করুন</em><span id="rw">+0 RC</span></h2>
<svg class="pp p1" style="color:#28e297;--hair:#2b1b12"><use href="#pp"/></svg><svg class="pp p2" style="color:#3ddaa1;--hair:#4a2c14"><use href="#pp"/></svg><svg class="pp p3" style="color:#e8a727;--hair:#161616"><use href="#pp"/></svg>

<button class="btn au" id="cp">⧉ কোড কপি করুন</button><div class="mu" id="nt" style="margin:12px 0">হোম পেজে ফিরে গিয়ে কোডটি বসিয়ে সাবমিট করুন — কয়েন সাথে সাথে ব্যালেন্সে যোগ হবে।</div><button class="btn" id="hm">🏠 হোম পেজে ফিরে যান</button></div>
<div class="mu c" id="ft"></div></div>
<script>(async()=>{
const FC={apiKey:"AIzaSyAm6kON2hANHeswKYi5JidgElFPhVw3J48",authDomain:"bd-earn-ff.firebaseapp.com",projectId:"bd-earn-ff",storageBucket:"bd-earn-ff.firebasestorage.app",messagingSenderId:"354176974621",appId:"1:354176974621:web:fcf93aaa013ca8ed3c6bf4"},TG=window.Telegram?.WebApp;TG?.ready();TG?.expand();
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),td=()=>new Date(Date.now()+216e5).toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=t=>{const m=$('#msg');m.innerHTML=t;m.classList.remove('hide')};
const sc=$('#scene');for(let i=0;i<9;i++){const e=document.createElement('span');e.className='bn';e.textContent='৳';e.style.cssText=`left:${4+i*10.5}%;animation-duration:${4+Math.random()*3}s;animation-delay:${Math.random()*4}s`;sc.appendChild(e)}
for(let i=0;i<7;i++){const e=document.createElement('span');e.className='cn';e.style.cssText=`left:${6+i*13}%;animation-duration:${2.8+Math.random()*2}s;animation-delay:${Math.random()*3}s`;sc.appendChild(e)}
$('#hm').onclick=()=>location.href='./';
try{
const V='https://www.gstatic.com/firebasejs/10.12.2/';const[a,f,au]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js'),import(V+'firebase-auth.js')]);
const app=a.initializeApp(FC),db=f.getFirestore(app),auth=au.getAuth(app);await au.signInAnonymously(auth);
const cs=await f.getDoc(f.doc(db,'config','app')),cfg={siteName:'BD Earn FF',jobRw:1,jobMax:10,jobSec:15,jobLinks:[],...(cs.exists()?cs.data():{})};
$('#sn').textContent=cfg.siteName;$('#lg').textContent=String(cfg.siteName||'B').trim().charAt(0).toUpperCase();if(cfg.landTitle)$('#ht').textContent=cfg.landTitle;if(cfg.landNote)$('#nt').textContent=cfg.landNote;document.title=cfg.siteName+' — Ad Job';$('#rw').textContent='+'+cfg.jobRw+' RC';$('#ft').textContent='© '+cfg.siteName;
const qp=new URLSearchParams(location.search),ID=qp.get('u')||'',tid=qp.get('t')||'',us=ID?await f.getDoc(f.doc(db,'users',ID)):null;
if(!us||!us.exists()||us.data().owner!==auth.currentUser.uid)return msg('অনুগ্রহ করে হোম পেজের Earn সেকশন থেকে "অ্যাড জব" বাটনে চাপ দিয়ে শুরু করুন।<br><br><button class="btn" onclick="location.href=\'./\'">🏠 হোম পেজ</button>');
const u=us.data();if(u.jobDay===td()&&(u.jobsToday||0)>=cfg.jobMax)return msg('আজকের জব লিমিট শেষ। আগামীকাল আবার চেষ্টা করুন।');
let tk=null;if(tid){const ts=await f.getDoc(f.doc(db,'tasks',tid));if(ts.exists())tk=ts.data()}
const L=(tk?(tk.links||[]):(cfg.jobLinks||[]).filter(x=>x.on&&x.url)).slice(0,8),SEC=+(tk?tk.sec:cfg.jobSec)||15;if(tk){$('#rw').textContent='+'+tk.rc+' RC';$('#sn').textContent=cfg.siteName+' · '+tk.title}
if(!L.length)return msg('এখন কোনো জব নেই। পরে চেষ্টা করুন।');
const ref=await f.addDoc(f.collection(db,'jobs'),{owner:auth.currentUser.uid,uid:ID,t0:f.serverTimestamp(),done:false,claimed:false,n:L.length,sec:SEC,tid});
const open=u=>TG?.openLink?TG.openLink(u):window.open(u,'_blank');
$('#ads').innerHTML=L.map((x,i)=>`<div class="ad ${i?'':'on'}" id="a${i}"><div class="ring" id="r${i}"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="28"/><circle class="fg" cx="32" cy="32" r="28"/></svg><b>${i?'🔒':'TAP'}</b></div><div><b>বিজ্ঞাপন ${i+1}/${L.length}</b><div class="mu">${esc(x.name)} · ${SEC} সেকেন্ড</div></div><span class="st">${i?'লক':'ট্যাপ করুন'}</span></div>`).join('');
let cur=0,t0=0,iv;
const finish=async()=>{const code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);let ok=0;
 for(let i=0;i<10&&!ok;i++){try{await f.updateDoc(ref,{done:true,code});ok=1}catch(e){await sleep(2500)}}
 if(!ok)return msg('সেশন যাচাই হয়নি। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।');
 $('#code').innerHTML=[...code].map((d,i)=>`<i style="animation-delay:${i*.12}s">${d}</i>`).join('');$('#done').classList.remove('hide');
 $('#cp').onclick=()=>{navigator.clipboard?.writeText(code);$('#cp').textContent='✓ কপি হয়েছে'}};
const tick=()=>{const i=cur,el=$('#a'+i),left=SEC-(Date.now()-t0)/1000;
 el.querySelector('.fg').style.strokeDashoffset=176*(1-Math.min(1,(SEC-left)/SEC));
 if(left>0){el.querySelector('b').textContent=Math.ceil(left);return}
 clearInterval(iv);el.className='ad ok';el.querySelector('.ring').classList.remove('run');el.querySelector('b').textContent='✓';el.querySelector('.st').textContent='সম্পন্ন';t0=0;cur++;
 if(cur<L.length){const n=$('#a'+cur);n.classList.add('on');n.querySelector('b').textContent='TAP';n.querySelector('.st').textContent='ট্যাপ করুন'}else finish()};
L.forEach((x,i)=>$('#r'+i).onclick=()=>{if(i!==cur)return;open(x.url);if(!t0){t0=Date.now();$('#r'+i).classList.add('run');$('#a'+i).querySelector('.st').textContent='অপেক্ষা করুন…';iv=setInterval(tick,250);tick()}});
}catch(e){console.error(e);msg('সংযোগ সমস্যা হয়েছে। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।')}
})();</script><script src="emoji.js"></script>
<script>(()=>{let q=0;const CD='https://cdn.jsdelivr.net/npm/emoji-datasource-google@16.0.0/img/google/64/',TB='https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/';

const EO=window.EO={className:'em',callback:i=>{const k=i.replace(/-fe0f/g,'');return(window.EMJ&&EMJ[k])||CD+k+'.png'},attributes:()=>({decoding:'sync'})};
const T=()=>{q=0;if(!window.twemoji)return;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const v=n.nodeValue,f=FE(v);if(f!==v&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))n.nodeValue=f}twemoji.parse(document.body,EO)};
new MutationObserver(()=>{q||(q=requestAnimationFrame(T))}).observe(document.body,{childList:true,subtree:true,characterData:true});window.addEventListener('load',T);
document.addEventListener('error',e=>{const t=e.target;if(!t||!t.classList||!t.classList.contains('em'))return;const n=+t.dataset.f||0;t.dataset.f=n+1;try{const c=twemoji.convert.toCodePoint(t.alt);if(n==0)t.src=CD+c+'-fe0f.png';else if(n==1)t.src=TB+c+'.png'}catch(_){}},true)})()</script>
